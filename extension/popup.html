<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anti-Ragebait</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <h1>Anti-Ragebait</h1>
  <label class="filter-control">
    <span>Saring unggahan X</span>
    <input id="enabled" type="checkbox" role="switch" disabled>
  </label>
  <label class="filter-control">
    <span>Blokir politik di Beranda</span>
    <input id="politicsEnabled" type="checkbox" role="switch" disabled>
  </label>
  <p id="status" role="status" hidden></p>
  <section aria-labelledby="history-heading">
    <h2 id="history-heading">Riwayat blokir</h2>
    <p id="blocked-count" role="status">Menghitung unggahan…</p>
    <p id="history-status">Memuat riwayat…</p>
    <ul id="block-history" class="block-history" aria-label="Unggahan terakhir yang diblokir"></ul>
    <template id="history-entry">
      <li>
        <details>
          <summary>
            <span class="entry-label"></span>
            <time></time>
          </summary>
          <p class="entry-excerpt" dir="auto"></p>
        </details>
      </li>
    </template>
  </section>
</body>
</html>
